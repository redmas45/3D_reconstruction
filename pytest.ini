[pytest]
testpaths = backend/tests
pythonpath = backend

# Integration tests drive a real headless Blender: minutes, not milliseconds, and they
# skip entirely where Blender is absent. Excluded from the default run so `pytest` stays
# a fast feedback loop; `pytest -m integration` opts in (the trailing -m wins).
markers =
    integration: requires a real Blender installation

# -p no:cacheprovider: the repo lives under a directory where pytest cannot write its
# cache, which otherwise emits a permission warning on every run.
addopts = -m "not integration" -p no:cacheprovider
